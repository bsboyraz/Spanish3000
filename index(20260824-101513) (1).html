function lessonWordKey(l,w){return `${l.id}::${w[0]}`}
function learnedLessonCount(l){const a=state.lessonWords?.[l.id]||[];return a.length}
function renderVocabBody(){
 const l=vocabLesson,host=document.getElementById('vocabBody');if(vocabMode==='test')return renderVocabTest();
 const w=l.vocab[vocabIndex%l.vocab.length],key=lessonWordKey(l,w),learned=(state.lessonWords?.[l.id]||[]).includes(key);
 host.innerHTML=`<div class="word-layout"><div class="word-card"><div class="word-meta"><span class="tag">${l.level}</span><span class="tag">${vocabIndex+1} / ${l.vocab.length}</span></div><div class="word">${esc(w[0])}</div><div class="meaning">${esc(w[1])}</div><button class="big-speak" id="speakWord">🔊</button><div class="word-actions"><button class="ghost" id="prevWord">← Önceki</button><button class="${learned?'ghost':'primary'}" id="learnWord">${learned?'✓ Öğrenildi':'Öğrendim +5 XP'}</button><button class="ghost" id="nextWord">Sonraki →</button></div></div>
 <div class="side-stack"><div class="mini"><h3>Bu ders</h3><div class="mini-row"><span>Öğrenilen</span><b>${learnedLessonCount(l)} / ${l.vocab.length}</b></div><div class="bar"><i style="width:${learnedLessonCount(l)/l.vocab.length*100}%"></i></div></div><div class="mini"><h3>Kelime listesi</h3><div class="word-list">${l.vocab.map((x,i)=>`<button data-pick="${i}"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></button>`).join('')}</div></div></div></div>`;
 document.getElementById('speakWord').onclick=()=>speak(w[0]);document.getElementById('prevWord').onclick=()=>{vocabIndex=(vocabIndex-1+l.vocab.length)%l.vocab.length;renderVocabBody()};document.getElementById('nextWord').onclick=()=>{vocabIndex=(vocabIndex+1)%l.vocab.length;renderVocabBody()};
 document.getElementById('learnWord').onclick=()=>{if(learned){toast('Bu kelime zaten öğrenildi.');return}state.lessonWords[l.id]=[...(state.lessonWords[l.id]||[]),key];award(5);toast('+5 XP · Öğrenildi');vocab();};
 host.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{vocabIndex=Number(b.dataset.pick);renderVocabBody()})
}
function renderVocabTest(){const l=vocabLesson,host=document.getElementById('vocabBody');if(!vocabQuiz)vocabQuiz=createWordQuiz(l.vocab);const q=vocabQuiz;host.innerHTML=`<div class="quiz-shell"><div class="quiz-top"><span>Kelime testi</span><span>${l.title}</span></div><div class="question" style="text-align:center;font-size:38px">${esc(q.target[0])}</div><div class="hint" style="text-align:center">Doğru Türkçe anlamı seç.</div><div class="options">${q.choices.map((x,i)=>`<button class="option" data-opt="${i}">${esc(x[1])}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="nextline"><button id="nextV" class="primary" style="display:none">Yeni kelime →</button></div></div>`;host.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(q.answered)return;q.answered=true;const i=Number(b.dataset.opt),ok=q.choices[i][0]===q.target[0];host.querySelectorAll('[data-opt]').forEach((x,j)=>{x.disabled=true;if(q.choices[j][0]===q.target[0])x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Doğru!':'✕ Yanlış.'}</strong>${esc(q.target[0])} = ${esc(q.target[1])}`;document.getElementById('nextV').style.display='inline-block';record(ok,8)});document.getElementById('nextV').onclick=()=>{vocabQuiz=null;renderVocabTest()}}
function spanishPool(){let p=WORDS.filter(w=>(w.level||'').toUpperCase()===level);if(allSearch.trim()){const s=norm(allSearch);p=p.filter(w=>norm(w.word).includes(s)||norm(w.meaning).includes(s))}return p}
function levelCount(l){return WORDS.filter(w=>(w.level||'').toUpperCase()===l).length}
function levelLearned(l){const ids=new Set(state.spanishLearned);return WORDS.filter(w=>(w.level||'').toUpperCase()===l&&ids.has(w.id)).length}
function spanish3000(){
 const pool=spanishPool();if(allWordIndex>=pool.length)allWordIndex=0;
 view.innerHTML=`<div class="page-head"><div><div class="eyebrow">Bağımsız kelime bankası</div><h1>Spanish 3000 🇪🇸</h1><p class="lead">Ders kelimelerinden bağımsız olarak 3000 kelimeyi A1, A2, B1 veya B2 çalışma seviyesine göre filtrele.</p></div><span class="pill">${WORDS.length} kelime</span></div>
 <div class="level-summary">${['A1','A2','B1','B2'].map(l=>`<div class="level-box"><b>${levelLearned(l)} / ${levelCount(l)}</b><small>${l} öğrenildi</small></div>`).join('')}</div>
 <div class="toolbar"><div class="level-tabs">${['A1','A2','B1','B2'].map(l=>`<button class="level-btn ${level===l?'active':''}" data-level="${l}">${l}</button>`).join('')}</div><input id="allSearch" value="${esc(allSearch)}" placeholder="Kelime veya Türkçe anlam ara..."><div class="seg"><button data-allmode="cards" class="${allMode==='cards'?'active':''}">Kart</button><button data-allmode="test" class="${allMode==='test'?'active':''}">Test</button></div></div><div id="allBody"></div>`;
 view.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;allWordIndex=0;allQuiz=null;spanish3000()});view.querySelectorAll('[data-allmode]').forEach(b=>b.onclick=()=>{allMode=b.dataset.allmode;allQuiz=null;spanish3000()});document.getElementById('allSearch').oninput=e=>{allSearch=e.target.value;allWordIndex=0;renderAllBody()};renderAllBody()
}
function renderAllBody(){
 const host=document.getElementById('allBody'),pool=spanishPool();if(!pool.length){host.innerHTML='<div class="empty">Bu aramayla eşleşen kelime bulunamadı.</div>';return}if(allMode==='test')return renderAllTest();
 const w=pool[allWordIndex%pool.length],learned=state.spanishLearned.includes(w.id);
 host.innerHTML=`<div class="word-layout"><div class="word-card"><div class="word-meta"><span class="tag">${esc(w.level)}</span><span class="tag">${esc(w.pos||'kelime')}</span><span class="tag">#${w.id}</span></div><div class="word">${esc(w.word)}</div><div class="meaning">${esc(w.meaning)}</div><button class="big-speak" id="allSpeak">🔊</button><div class="word-actions"><button class="ghost" id="allPrev">← Önceki</button><button class="${learned?'ghost':'primary'}" id="allLearn">${learned?'✓ Öğrenildi':'Öğrendim +5 XP'}</button><button class="ghost" id="allRandom">🎲 Rastgele</button><button class="ghost" id="allNext">Sonraki →</button></div></div><div class="side-stack"><div class="mini"><h3>${level} ilerleme</h3><div class="mini-row"><span>Öğrenilen</span><b>${levelLearned(level)} / ${levelCount(level)}</b></div><div class="bar"><i style="width:${levelCount(level)?levelLearned(level)/levelCount(level)*100:0}%"></i></div></div><div class="mini"><h3>Arama sonuçları</h3><div class="word-list">${pool.slice(Math.max(0,allWordIndex-7),Math.max(0,allWordIndex-7)+20).map((x,i)=>`<button data-allpick="${Math.max(0,allWordIndex-7)+i}"><b>${esc(x.word)}</b><small>${esc(x.meaning)}</small></button>`).join('')}</div></div></div></div>`;
 document.getElementById('allSpeak').onclick=()=>speak(w.word);document.getElementById('allPrev').onclick=()=>{allWordIndex=(allWordIndex-1+pool.length)%pool.length;renderAllBody()};document.getElementById('allNext').onclick=()=>{allWordIndex=(allWordIndex+1)%pool.length;renderAllBody()};document.getElementById('allRandom').onclick=()=>{allWordIndex=Math.floor(Math.random()*pool.length);renderAllBody()};
 document.getElementById('allLearn').onclick=()=>{if(learned){toast('Bu kelime zaten öğrenildi.');return}state.spanishLearned=[...new Set([...state.spanishLearned,w.id])];award(5);toast('+5 XP · Öğrenildi');spanish3000()};
 host.querySelectorAll('[data-allpick]').forEach(b=>b.onclick=()=>{allWordIndex=Number(b.dataset.allpick);renderAllBody()})
}
function createAllQuiz(pool){const target=pool[Math.floor(Math.random()*pool.length)],others=shuffle(pool.filter(w=>w.id!==target.id)).slice(0,3);return {target,choices:shuffle([target,...others]),answered:false}}
function renderAllTest(){const host=document.getElementById('allBody'),pool=spanishPool();if(pool.length<4){host.innerHTML='<div class="empty">Test için en az 4 eşleşen kelime gerekir. Arama filtresini temizle.</div>';return}if(!allQuiz)allQuiz=createAllQuiz(pool);const q=allQuiz;host.innerHTML=`<div class="quiz-shell"><div class="quiz-top"><span>${level} Spanish 3000 testi</span><span>+10 XP</span></div><div class="question" style="text-align:center;font-size:38px">${esc(q.target.word)}</div><div class="hint" style="text-align:center"><button class="speak" id="allTestSpeak">🔊 Dinle</button> · Doğru Türkçe anlamı seç.</div><div class="options">${q.choices.map((x,i)=>`<button class="option" data-opt="${i}">${esc(x.meaning)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="nextline"><button id="nextAll" class="primary" style="display:none">Yeni kelime →</button></div></div>`;document.getElementById('allTestSpeak').onclick=()=>speak(q.target.word);host.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(q.answered)return;q.answered=true;const i=Number(b.dataset.opt),ok=q.choices[i].id===q.target.id;host.querySelectorAll('[data-opt]').forEach((x,j)=>{x.disabled=true;if(q.choices[j].id===q.target.id)x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Doğru!':'✕ Yanlış.'}</strong>${esc(q.target.word)} = ${esc(q.target.meaning)}`;document.getElementById('nextAll').style.display='inline-block';record(ok,10)});document.getElementById('nextAll').onclick=()=>{allQuiz=null;renderAllTest()}}
function progress(){
 const lessonLearned=Object.values(state.lessonWords||{}).reduce((a,b)=>a+(b?.length||0),0),badges=[
 ['🌱','İlk kelime',state.spanishLearned.length+lessonLearned>=1],['📚','50 kelime',state.spanishLearned.length+lessonLearned>=50],['🎯','%80 doğruluk',(state.correct+state.wrong)>=10&&accuracy()>=80],['⚡','500 XP',state.xp>=500],['🔥','3 günlük seri',state.streak>=3]
 ];
 view.innerHTML=`<div class="page-head"><div><div class="eyebrow">Motivasyon</div><h1>İlerleme & Liderlik</h1><p class="lead">Bu GitHub Pages sürümünde profil ve puanlar bu cihazda saklanır.</p></div><span class="pill">⚡ ${state.xp} XP</span></div>
 <div class="progress-grid"><div class="panel"><h2>Senin skorun</h2><div class="rank"><div class="num">1</div><div class="grow"><b>${esc(state.name)}</b><div style="color:var(--muted);font-size:12px">Bu cihazdaki profil</div></div><b>${state.xp} XP</b></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>%${accuracy()}</b><span>doğruluk</span></div><div class="stat"><b>${state.streak}</b><span>günlük seri</span></div><div class="stat"><b>${lessonLearned}</b><span>ders kelimesi</span></div><div class="stat"><b>${state.spanishLearned.length}</b><span>Spanish 3000</span></div></div></div>
 <div class="panel"><h2>Rozetler</h2>${badges.map(b=>`<div class="rank" style="opacity:${b[2]?1:.42}"><div class="num">${b[0]}</div><div class="grow"><b>${b[1]}</b><div style="color:var(--muted);font-size:12px">${b[2]?'Kazanıldı':'Henüz kilitli'}</div></div>${b[2]?'✓':''}</div>`).join('')}</div></div>
 <section class="section"><div class="section-title"><div><h2>Ders kelime ilerlemesi</h2><p>Her dersin kendi kelime takibi.</p></div></div><div class="course-grid">${LESSONS.map(l=>`<div class="course-card"><span class="count">${learnedLessonCount(l)}/${l.vocab.length}</span><div class="folder">${l.icon}</div><h3>${l.no}. ${esc(l.title)}</h3><div class="bar"><i style="width:${learnedLessonCount(l)/l.vocab.length*100}%"></i></div></div>`).join('')}</div></section>`
}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.getElementById('avatar').onclick=()=>{const n=prompt('Profil adı:',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,24);save();render()}};
chrome();render();
})();
</script>
</body>
