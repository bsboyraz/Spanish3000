*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:286px 1fr}
.sidebar{position:fixed;inset:0 auto 0 0;width:286px;background:#fff;border-right:1px solid var(--line);padding:26px 20px;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 22px}.logo{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,var(--orange),#ffab78);display:grid;place-items:center;font-size:25px;box-shadow:0 10px 24px rgba(255,125,93,.22)}
.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#aaa4b4;padding:12px 12px 7px;font-weight:900}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;border-radius:14px;text-align:left;padding:13px 14px;display:flex;gap:12px;align-items:center;color:#656073;font-weight:780}
.nav button:hover{background:#faf8ff}.nav button.active{background:var(--purple2);color:var(--purple)}.nav .ico{width:23px;text-align:center;font-size:17px}
.side-progress{margin-top:auto;border:1px solid #dfd6ff;background:linear-gradient(180deg,#f8f4ff,#fff);border-radius:19px;padding:15px}.side-progress .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.side-progress strong{color:var(--purple)}
.bar{height:8px;background:#e9e5f0;border-radius:99px;overflow:hidden;margin:10px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#9b7cf0);border-radius:inherit}
.main{grid-column:2;min-width:0}.topbar{height:82px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 4vw;position:sticky;top:0;z-index:20}
.top-actions{display:flex;align-items:center;gap:9px}.chip,.avatar{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:850;box-shadow:0 3px 12px rgba(35,30,55,.04)}
.avatar{width:42px;height:42px;padding:0;background:var(--orange2);color:#d65335}.content{width:min(1180px,calc(100% - 6vw));margin:38px auto 100px}

.hero h1,.page-head h1{font-size:clamp(30px,4vw,48px);margin:5px 0 10px;letter-spacing:-.04em}.hero p,.lead{color:var(--muted);line-height:1.65}.hero-art{min-height:190px;border-radius:25px;background:linear-gradient(145deg,#ffd6c8,#f2e9ff);display:grid;place-items:center;font-size:72px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--purple);font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.primary,.secondary,.ghost,.back{border:0;border-radius:13px;padding:11px 16px;font-weight:850}.primary{background:var(--purple);color:#fff;box-shadow:0 9px 20px rgba(118,82,223,.20)}.secondary{background:var(--orange);color:#fff}.ghost,.back{background:#f6f3fa;color:#625d6e}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font-size:clamp(29px,3.3vw,44px)}
.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--purple2);color:var(--purple);font-size:11px;font-weight:900}
.section{margin-top:30px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-title h2{font-size:24px;margin:0 0 4px}.section-title p{color:var(--muted);margin:0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}

.lesson-shell{background:#fff;border:1px solid var(--line);border-radius:27px;padding:34px;box-shadow:var(--shadow)}.lesson-copy{font-size:15px;line-height:1.78;color:#474252}.lesson-copy h3{color:var(--ink);font-size:22px;margin:24px 0 8px}.lesson-copy h3:first-child{margin-top:0}.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.rule-grid>div{background:#faf8ff;border:1px solid #e7e0fa;border-radius:15px;padding:15px;line-height:1.7}

ılabilir.</p>\n<p>Bu bölümde kalıpları tanıyoruz; <b>llamarse</b> fiilinin ayrıntılı çekimi 4. derste çalışılacak.</p>\n\n<h3>5. Nerelisin? Nerede yaşıyorsun?</h3>\n<p><b>¿De dónde eres?</b> = Nerelisin? · <b>¿Dónde vives?</b> = Nerede yaşıyorsun? · <b>¿Cuál es tu nacionalidad?</b> = Milliyetin ne?</p>\n<p><b>Vivo en Estambul.</b> · <b>Soy de Turquía.</b> · <b>Soy turco.</b> (erkek) · <b>Soy turca.</b> (kadın).</p>\n\n<h3>6. Tanışma ve nezaket</h3>\n<p><b>Mucho gusto</b> = Çok memnun oldum. <b>Encantado / Encantada</b> = Memnun oldum. <b>Encantado/a de conocerte</b> = Tanıştığımıza memnun oldum.</p>\n<p><b>Por favor</b> = Lütfen · <b>Lo siento</b> = Üzgünüm · <b>Disculpe</b> = Afedersiniz · <b>No importa</b> = Önemli değil · <b>¿Es verdad?</b> = Gerçekten mi? · <b>Con permiso</b> = İzninizle · <b>Perdón</b> = Pardon.</p>\n\n<h3>7. Anlamadığında kullanabileceğin kalıplar</h3>\n<p><b>Entiendo</b> = Anladım. <b>No entiendo</b> = Anlamadım. <b>¿Más despacio, por favor?</b> = Daha yavaş, lütfen. <b>Por favor, habla más despacio.</b> = Lütfen daha yavaş konuş.</p>\n<p><b>¿Hablas español?</b> = İspanyolca konuşuyor musun? · <b>¿Sabes español?</b> = İspanyolca biliyor musun? · <b>No hablo español.</b> = İspanyolca konuşamıyorum. · <b>¿Cómo se dice...?</b> = ... nasıl söylenir?</p>\n\n<h3>8. Teşekkür ve vedalaşma</h3>\n<p><b>Muchas gracias</b> = Çok teşekkür ederim. <b>De nada</b> = Rica ederim. <b>Hasta pronto</b> = Yakında görüşürüz. <b>Hasta luego</b> = Sonra görüşürüz. <b>Hasta mañana</b> = Yarın görüşürüz. <b>Hasta la vista</b> = Görüşmek üzere.</p>\n\n<h3>9. Diğer yararlı günlük ifadeler</h3>\n<p><b>Feliz cumpleaños</b> = Doğum günün kutlu olsun. <b>Buena suerte</b> = İyi şanslar. <b>Sí</b> = Evet; aksansız <b>si</b> = eğer. <b>No lo sé</b> = Bilmiyorum.</p>\n<p><b>Señora</b> = Bayan/hanımefendi, <b>Señorita</b> = genç hanımefendi, <b>Señor</b> = Bay/beyefendi.</p>\n\n<h3>10. Mini tanıtım modeli</h3>\n<p>Öğrenci bu dersin sonunda aşağıdaki yapıyı okuyup anlayabilmeli. ]},{"id":"llamarse","no":4,"level":"A1","title":"Llamarse","icon":"🪪","summary":"Ad sorma, ad söyleme ve kendini tanıtma.","theory":"\n<h3>¿Cómo te llamas?</h3>\n<p><b>Llamarse</b> “adının olması” anlamında dönüşlü bir fiildir. Temel çekim: <b>me llamo, te llamas, se llama, nos llamamos, os llamáis, se llaman</b>.</p>\n<p>Ad sormak: <b>¿Cómo te llamas?</b> Cevap: <b>Me llamo Ana.</b></p>\n<p>Başkasının adını sormak: <b>¿Cómo se llama?</b> — <b>Se llama Carlos.</b></p>\n<p>Tanışmada bunun yanında <b>¿De dónde eres?</b>, <b>¿Dónde vives?</b>, <b>¿Cuántos años tienes?</b> gibi kalıplar da kullanılır.</p>\n","vocab":[["llamarse","adının olması"],["me llamo","benim adım"],["te llamas","senin adın"],["se llama","onun adı"],["nos llamamos","bizim adımız"],["os llamáis","sizin adınız"],["se llaman","onların adı"],["nombre","isim"],["apellido","soyadı"],["¿Cómo te llamas?","Adın ne?"],["¿De dónde eres?","Nerelisin?"],["¿Dónde vives?","Nerede yaşıyorsun?"],["¿Cuántos años tienes?","Kaç yaşındasın?"],["Mucho gusto","Tanıştığıma memnun oldum"]],"examples":[["Me llamo Berra Sare.","Benim adım Berra Sare."],["¿Cómo te llamas?","Adın ne?"],["Mi profesora se llama Ana.","Öğretmenimin adı Ana."]],"quiz":[{"q":"“Benim adım Ana” hangisidir?","options":["Me llamas Ana.","Me llamo Ana.","Se llamo Ana.","Soy llamo Ana."],"a":1,"why":"Yo için me llamo kullanılır."},{"q":"“Adın ne?” nasıl sorulur?","options":["¿Dónde vives?","¿Cómo te llamas?","¿Qué hora es?","¿Cuántos años? "],"a":1,"why":"¿Cómo te llamas? = Adın ne?"},{"q":"Él ___ Pedro.","options":["me llamo","te llamas","se llama","nos llamamos"],"a":2,"why":"Él/ella/usted için se llama."},{"q":"Nosotros ___ Marta y Luis.","options":["se llaman","nos llamamos","me llamo","os llamáis"],"a":1,"why":"Nosotros için nos llamamos."},{"q":"“Onların adı…” için hangi yapı?","options":["se llaman","se llama","te llamas","me llamo"],"a":0,"why":"Ellos/ellas/ustedes → se llaman."}],"sentences":[{"tr":"Benim adım Berra Sare.","es":"Me llamo Berra Sare."},{"tr":"Adın ne?","es":"¿Cómo te llamas?"},{"tr":"Onun adı Carlos.","es":"Se llama Carlos."},{"tr":"Bizim adımız Ana ve Luis.","es":"Nos llamamos Ana y Luis."}]},{"id":"articulos","no":5,"level":"A1","title":"Artikeller","icon":"🧩","summary":"El/la/los/las ile un/una/unos/unas ve isimlerin cinsiyeti.","theory":"\n<h3>Belirli ve belirsiz artikeller</h3>\n<p>Belirli artikeller: <b>el</b> (eril tekil), <b>la</b> (dişil tekil), <b>los</b> (eril çoğul), <b>las</b> (dişil çoğul).</p>\n<p>Belirsiz artikeller: <b>un, una, unos, unas</b>. Belirli bir şeyi söylüyorsak <b>el libro</b>; herhangi bir kitap diyorsak <b>un libro</b>.</p>\n<p>Çoğu <b>-o</b> ile biten isim eril, çoğu <b>-a</b> ile biten isim dişildir; ancak istisnalar vardır. Kelimeyi artikel ile birlikte öğrenmek en güvenli yöntemdir.</p>\n<p>Çoğul: sesli harfle bitenlere genelde <b>-s</b>, sessizle bitenlere <b>-es</b> gelir: libro → libros, papel → papeles.</p>\n","vocab":[["el lápiz","kurşun kalem"],["el bolígrafo","tükenmez kalem"],["la goma de borrar","silgi"],["el borrador","silgi / tahta silgisi"],["el estuche","kalem kutusu"],["el sacapuntas","kalemtıraş"],["la regla","cetvel"],["el libro","kitap"],["el cuaderno","defter"],["la hoja de papel","kağıt yaprağı"],["la mochila","sırt çantası"],["el subrayador","fosforlu kalem"],["la calculadora","hesap makinesi"],["la carpeta","dosya"],["las tijeras","makas"],["el escritorio","çalışma masası"],["la silla","sandalye"],["el ordenador","bilgisayar"],["la papelera","çöp kutusu"],["la pizarra","tahta"]],"examples":[["El libro está en la mesa.","Kitap masanın üzerinde."],["Tengo una mochila roja.","Kırmızı bir sırt çantam var."],["Las tijeras están aquí.","Makas burada."]],"quiz":[{"q":"___ libro","options":["la","el","las","una"],"a":1,"why":"Libro eril tekildir: el libro."},{"q":"___ mochila","options":["el","la","los","un"],"a":1,"why":"Mochila dişil tekildir: la mochila."},{"q":"Belirsiz dişil tekil artikel hangisi?","options":["un","una","unos","las"],"a":1 :"En agosto tengo vacaciones."},{"tr":"Masada üç kitap var.","es":"Hay tres libros sobre la mesa."}]},{"id":"numeros","no":9,"level":"A1","title":"Sayılar","icon":"🔢","summary":"0–100 sayılarını söyleme, dinleme ve yazma.","theory":"\n<h3>Los números</h3>\n<p>0–15 arasını tek tek öğrenmek en kolayıdır. 16–19 <b>dieci-</b>, 21–29 <b>veinti-</b> ile birleşik yazılır.</p>\n<p>30'dan sonra onlar basamağı + <b>y</b> + birler kullanılır: <b>treinta y dos</b>, <b>cuarenta y cinco</b>.</p>\n<p>100 tek başına <b>cien</b> şeklindedir. Telefon, yaş, fiyat ve saat çalışmalarında sayıları bol bol tekrar etmek önemlidir.</p>\n","vocab":[["0","cero"],["1","uno"],["2","dos"],["3","tres"],["4","cuatro"],["5","cinco"],["6","seis"],["7","siete"],["8","ocho"],["9","nueve"],["10","diez"],["11","once"],["12","doce"],["13","trece"],["14","catorce"],["15","quince"],["16","dieciséis"],["17","diecisiete"],["18","dieciocho"],["19","diecinueve"],["20","veinte"],["21","veintiuno"],["22","veintidós"],["23","veintitrés"],["24","veinticuatro"],["25","veinticinco"],["26","veintiséis"],["27","veintisiete"],["28","veintiocho"],["29","veintinueve"],["30","treinta"],["31","treinta y uno"],["32","treinta y dos"],["33","treinta y tres"],["34","treinta y cuatro"],["35","treinta y cinco"],["36","treinta y seis"],["37","treinta y siete"],["38","treinta y ocho"],["39","treinta y nueve"],["40","cuarenta"],["41","cuarenta y uno"],["42","cuarenta y dos"],["50","cincuenta"],["53","cincuenta y tres"],["54","cincuenta y cuatro"],["60","sesenta"],["65","sesenta y cinco"],["66","sesenta y seis"],["70","setenta"],["77","setenta y siete"],["80","ochenta"],["88","ochenta y ocho"],["90","noventa"],["99","noventa y nueve"],["100","cien"]],"examples":[["Tengo veintidós años.","Yirmi iki yaşındayım."],["Cuesta treinta y cinco euros.","Otuz beş avro tutuyor."],["Mi número termina en ochenta y ocho.","Numaram seksen sekiz ile bitiyor."]],"quiz":[{"q":"23 hangisidir?","options":["veintidós","veintitrés","treinta y tres","veinte y tres"],"a":1,"why":"23 = veintitrés."},{"q":"40 hangisidir?","options":["cuarenta","cincuenta","treinta","sesenta"],"a":0,"why":"40 = cuarenta."},{"q":"“treinta y cinco” kaçtır?","options":["25","30","35","45"],"a":2,"why":"Treinta y cinco = 35."},{"q":"99 hangisidir?","options":["noventa y nueve","nueve y noventa","noventa nueve","ciento nueve"],"a":0,"why":"99 = noventa y nueve."},{"q":"100 tek başına nasıl söylenir?","options":["ciento","cien","mil","diez"],"a":1,"why":"100 = cien."}],"sentences":[{"tr":"Yirmi iki yaşındayım.","es":"Tengo veintidós años."},{"tr":"Otuz beş avro tutuyor.","es":"Cuesta treinta y cinco euros."},{"tr":"Doksan dokuz.","es":"Noventa y nueve."}]},{"id":"hora","no":10,"level":"A1","title":"Saatler","icon":"🕒","summary":"¿Qué hora es?, es la una, son las dos, y media, menos cuarto.","theory":"\n<h3>La hora</h3>\n<p>Saati sormak: <b>¿Qué hora es?</b></p>\n<p>Saat 1 için <b>Es la una</b>; diğer saatler için <b>Son las dos/tres...</b> kullanılır.</p>\n<p>Dakika eklemek: <b>y cinco</b>, <b>y cuarto</b> (çeyrek geçiyor), <b>y media</b> (buçuk). Bir sonraki saate kalan süre: <b>menos cuarto</b>.</p>\n<p>Tam saat: <b>en punto</b>. Bir etkinliğin saatini söylerken <b>a la una / a las dos</b> kullanılır.</p>\n","vocab":[["¿Qué hora es?","Saat kaç?"],["Es la una","Saat bir"],["Son las dos","Saat iki"],["Son las tres","Saat üç"],["y cinco","beş geçiyor"],["y diez","on geçiyor"],["y cuarto","çeyrek geçiyor"],["y media","buçuk"],["menos cuarto","çeyrek var"],["en punto","tam / tam saatinde"],["a la una","saat birde"],["a las dos","saat ikide"],["la hora","saat"],["el minuto","dakika"],["la mañana","sabah"],["la tarde","öğleden sonra"],["la noche","gece"]],"examples":[["Son las dos y cuarto.","Saat ikiyi çeyrek geçiyor."],["Son las cinco y media.","Saat beş buçuk."],["La clase empieza a las ocho.","Ders saat sekizde başlıyor."]],"quiz":[{"q":"1:00 nasıl söylenir?","options":["Son las una.","Es la una.","Es las una.","Son la una."],"a":1,"why":"Saat bir için tekil: Es la una."},{"q":"2:15 hangisidir?","options":["Son las dos y cuarto.","Son las dos y media.","Son las tres menos cuarto.","Es la dos y cuarto."],"a":0,"why":"2:15 = Son las dos y cuarto."},{"q":"5:30 hangisidir?","options":["Son las cinco en punto.","Son las cinco y media.","Son las seis menos cuarto.","Es la cinco y media."],"a":1,"why":"5:30 = Son las cinco y media."},{"q":"2:45 hangisidir?","options":["Son las dos y cuarto.","Son las tres menos cuarto.","Son las dos y media.","Son las tres y cuarto."],"a":1,"why":"2:45 = bir sonraki saat üçe çeyrek var."},{"q":"“Ders saat sekizde başlıyor”daki “sekizde” nasıl kurulur?","options":["en las ocho","a las ocho","de las ocho","por ocho"],"a":1,"why":"Etkinlik saati için a las kullanılır."}],"sentences":[{"tr":"Saat kaç?","es":"¿Qué hora es?"},{"tr":"Saat iki buçuk.","es":"Son las dos y media."},{"tr":"Saat üçe çeyrek var.","es":"Son las tres menos cuarto."},{"tr":"Ders saat sekizde başlıyor.","es":"La clase empieza a las ocho."}]},{"id":"descripciones","no":11,"level":"A1","title":"Fiziksel ve Karakteristik Özellikler","icon":"🙂","summary":"Ser, tener ve llevar ile insanları fiziksel ve kişilik yönünden tarif et.","theory":"\n<h3>Birini nasıl tarif ederiz?</h3>\n<p>Genel özellikler ve karakter için <b>ser</b>: <b>Es alto, simpático e inteligente.</b></p>\n<p>Saç/göz gibi “sahip olunan” özelliklerde <b>tener</b>: <b>Tiene el pelo largo. Tiene los ojos verdes.</b></p>\n<p>Üzerinde taşınan/giyilen şeylerde <b>llevar</b>: <b>Lleva gafas. Lleva una camiseta azul.</b></p>\n<p>Sıfatlar çoğunlukla isim/kişiye göre cinsiyet ve sayı uyumu gösterir: alto/alta, altos/altas.</p>\n","vocab":[["grande","büyük"],["pequeño / pequeña","küçük"],["alto / alta","uzun boylu / yüksek"],["bajo / baja","kısa boylu / alçak"],["delgado / delgada","zayıf"],["gordo / gorda","şişman"],["viejo / vieja","yaşlı / eski"],["nuevo / nueva","yeni / genç"],["guapo / guapa","yakışıklı / güzel"],["feo / fea","çirkin"],["limpio / limpia","temiz"],["sucio / sucia","kirli"],["largo / larga","uzun"],["corto / corta","kısa"],["rápido / rápida","hızlı"],["lento / lenta","yavaş"],["bueno / buena","iyi"],["malo / mala","kötü"],["fácil","kolay"],["difícil","zor"],["barato / barata","ucuz"],["caro / cara","pahalı"],["rico / rica","zengin / lezzetli"],["pobre","fakir"],["fuerte","güçlü"],["débil","güçsüz"],["importante","önemli"],["feliz","mutlu"],["triste","üzgün"],["abierto / abierta","açık"],["cerrado / cerrada","kapalı"],["tranquilo / tranquila","sakin"],["nervioso / nerviosa","gergin"],["el pelo","saç"],["los ojos","gözler"],["las gafas","gözlük"],["la camiseta","tişört"],["la camisa","gömlek"],["el vestido","elbise"],["la falda","etek"],["el pantalón","pantolon"],["los zapatos","ayakkabılar"],["la chaqueta","ceket"],["el abrigo","mont"],["el sombrero","şapka"],["los calcetines","çoraplar"],["la sudadera","sweatshirt"],["el pijama","pijama"],["la bufanda","atkı"],["los guantes","eldivenler"],["las botas","botlar"]],"examples":[["Es alta y simpática.","O uzun boylu ve sempatik."],["Tiene el pelo corto.","Saçı kısa."],["Lleva gafas y una camiseta roja.","Gözlük ve kırmızı bir tişört takıyor/giyiyor."]],"quiz":[{"q":"“O uzun boylu” için doğru yapı?","options":["Está alto.","Es alto.","Tiene alto.","Lleva alto."],"a":1,"why":"Genel fiziksel özellik için ser."},{"q":"“Saçı uzun” hangisi?","options":["Es el pelo largo.","Tiene el pelo largo.","Está pelo largo.","Lleva pelo largo."],"a":1,"why":"Saç gibi sahip olunan özelliklerde tener."},{"q":"“Gözlük takıyor” hangisi?","options":["Es gafas.","Tiene gafas siempre.","Lleva gafas.","Está gafas."],"a":2,"why":"Üzerinde taşıdığı şey için llevar."},{"q":"Kadın için “sempatik”?","options":["simpático","simpática","simpáticos","simpáticas"],"a":1,"why":"Dişil tekil: simpática."},{"q":"“kısa saç” hangisi?","options":["el pelo corto","el pelo bajo","el pelo pequeño","el pelo lento"],"a":0,"why":"Saç uzunluğu için corto/largo."}],"sentences":[{"tr":"O uzun boylu ve sempatik.","es":"Es alta y simpática."},{"tr":"Saçı kısa.","es":"Tiene el pelo corto."},{"tr":"Gözlük takıyor.","es":"Lleva gafas."},{"tr":"Mavi bir gömlek giyiyor.","es":"Lleva una camisa azul."}]},{"id":"lugar-ciudad","no":12,"level":"A1","title":"Yer-Yön Söyleme + Tiendas y Edificios de la Ciudad","icon":"📍","summary":"Şehirde yer sorma, konum tarif etme ve a/de/en/con/para/por/sin kullanımı.","theory":"\n<h3>Preposiciones de lugar</h3>\n<p>Konum için: <b>encima de, debajo de, al lado de, dentro de, fuera de, entre, delante de, detrás de, cerca de, lejos de</b>.</p>\n<p><b>¿Dónde está la farmacia?</b> — <b>Está al lado del banco.</b></p>\n<h3>A · de · en · con · para · por · sin</h3>\n<div class=\"rule-grid\">\n<div><b>a</b>: yön / saat → Voy <b>a</b> la biblioteca. Llego <b>a</b> las ocho.<br><b>de</b>: köken / sahiplik → Soy <b>de</b> Turquía. El libro <b>de</b> Ana.<br><b>en</b>: yer → Estoy <b>en</b> el banco.</div>\n<div><b>con</b>: ile → Voy <b>con</b> mi madre.<br><b>para</b>: amaç/alıcı → Es <b>para</b> mi padre.<br><b>por</b>: içinden/boyunca/neden → Camino <b>por</b> el parque.<br><b>sin</b>: olmadan → Salgo <b>sin</b> mi teléfono.</div>\n</div>\n<p><b>a + el = al</b> ve <b>de + el = del</b>: Voy <b>al</b> museo. Estoy al lado <b>del</b> banco.</p>\n","vocab":[["encima de","üstünde"],["debajo de","altında"],["al lado de","yanında"],["dentro de","içinde"],["fuera de","dışında"],["entre","arasında"],["delante de","önünde"],["detrás de","arkasında"],["cerca de","yakınında"],["lejos de","uzağında"],["a","-e/-a / yön"],["de","-den/-dan / ...nın"],["en","-de/-da / içinde"],["con","ile"],["para","için / -e doğru"],["por","boyunca / içinden / nedeniyle"],["sin","olmadan / -siz"],["la librería","kitapçı"],["la panadería","fırın"],["la carnicería","kasap"],["el hospital","hastane"],["la farmacia","eczane"],["la cafetería","kafe"],["el ayuntamiento","belediye binası"],["la granja","çiftlik"],["el parque","park"],["la pescadería","balıkçı"],["el banco","banka"],["la esta yunca hareket için por."},{"q":"Salgo ___ mi teléfono.","options":["con","en","sin","a"],"a":2,"why":"Sin = olmadan."}],"sentences":[{"tr":"Eczane bankanın yanında.","es":"La farmacia está al lado del banco."},{"tr":"Annemle müzeye gidiyorum.","es":"Voy al museo con mi madre."},{"tr":"Bu hediye annem için.","es":"Este regalo es para mi madre."},{"tr":"Telefonum olmadan çıkıyorum.","es":"Salgo sin mi teléfono."},{"tr":"Parkın içinden yürüyorum.","es":"Camino por el parque."}]},{"id":"regulares-preguntas","no":13,"level":"A1","title":"Düzenli Fiil Çekimi + Soru Kelimeleri","icon":"✍️","summary":"-ar/-er/-ir fiillerinin presente çekimi ve temel soru kelimeleri.","theory":"\n<h3>Presente de indicativo</h3>\n<div class=\"rule-grid\">\n<div><b>-AR: hablar</b><br>hablo · hablas · habla<br>hablamos · habláis · hablan</div>\n<div><b>-ER: comer</b><br>como · comes · come<br>comemos · coméis · comen</div>\n<div><b>-IR: vivir</b><br>vivo · vives · vive<br>vivimos · vivís · viven</div>\n</div>\n<p>Soru kelimeleri: <b>¿Qué?</b> ne/hangi, <b>¿Quién?</b> kim, <b>¿Dónde?</b> nerede, <b>¿Cómo?</b> nasıl, <b>¿Cuándo?</b> ne zaman, <b>¿Por qué?</b> neden, <b>¿Cuánto/a?</b> ne kadar/kaç.</p>\n","vocab":[["comprar","satın almak"],["comer","yemek"],["beber / tomar","içmek"],["vivir","yaşamak"],["trabajar","çalışmak"],["pagar","ödemek"],["necesitar","ihtiyaç duymak"],["hablar","konuşmak"],["escuchar","dinlemek"],["leer","okumak"],["escribir","yazmak"],["aprender","öğrenmek"],["estudiar","ders çalışmak"],["preguntar","soru sormak"],["¿Qué?","Ne? / Hangi?"],["¿Quién?","Kim?"],["¿Dónde?","Nerede?"],["¿Cómo?","Nasıl?"],["¿Cuándo?","Ne zaman?"],["¿Por qué?","Neden?"],["¿Cuánto / cuánta?","Ne kadar? / Kaç tane?"]],"examples":[["Yo hablo español.","Ben İspanyolca konuşuyorum."],["Nosotros comemos una manzana.","Biz bir elma yiyoruz."],["¿Dónde vives?","Nerede yaşıyorsun?"]],"quiz":[{"q":"Yo ___ español. (hablar)","options":["hablo","hablas","habla","hablamos"],"a":0,"why":"Yo + hablar → hablo."},{"q":"Nosotros ___ en Madrid. (vivir)","options":["vivo","vivimos","viven","vivís"],"a":1,"why":"Nosotros + vivir → vivimos."},{"q":"Ella ___ una manzana. (comer)","options":["como","comes","come","comen"],"a":2,"why":"Ella + comer → come."},{"q":"“Nerede?” hangisidir?","options":["¿Qué?","¿Dónde?","¿Cómo?","¿Cuándo?"],"a":1,"why":"¿Dónde? = Nerede?"},{"q":"“Neden?” hangisidir?","options":["¿Por qué?","¿Quién?","¿Cuánto?","¿Qué?"],"a":0,"why":"¿Por qué? = Neden?"},{"q":"Vosotros ___ música. (escuchar)","options":["escuchamos","escucháis","escuchan","escuchas"],"a":1,"why":"Vosotros + escuchar → escucháis."}],"sentences":[{"tr":"Ben İspanyolca konuşuyorum.","es":"Yo hablo español."},{"tr":"Biz Madrid'de yaşıyoruz.","es":"Nosotros vivimos en Madrid."},{"tr":"Nerede yaşıyorsun?","es":"¿Dónde vives?"},{"tr":"Neden İspanyolca öğreniyorsun?","es":"¿Por qué aprendes español?"}]},{"id":"irregulares","no":14,"level":"A1","title":"Fiil Çekimi: Düzensiz Fiiller","icon":"⚡","summary":"Ser, estar, ir, tener, hacer, venir, salir, poder, querer gibi sık fiiller.","theory":"\n<h3>Sık kullanılan düzensiz fiiller</h3>\n<p>Düzensiz fiillerin kökü veya kişi eki değişebilir. En sık kullanılanları kalıp olarak öğrenmek çok faydalıdır.</p>\n<div class=\"rule-grid\">\n<div><b>ir</b>: voy, vas, va, vamos, vais, van<br><b>hacer</b>: hago, haces, hace, hacemos, hacéis, hacen<br><b>tener</b>: tengo, tienes, tiene, tenemos, tenéis, tienen</div>\n<div><b>poder</b>: puedo, puedes, puede, podemos, podéis, pueden<br><b>querer</b>: quiero, quieres, quiere, queremos, queréis, quieren<br><b>venir</b>: vengo, vienes, viene...</div>\n</div>\n<p><b>salir → salgo</b>, <b>poner → pongo</b>, <b>decir → digo</b>, <b>saber → sé</b>, <b>ver → veo</b> gibi yo biçimleri özellikle önemlidir.</p>\n","vocab":[["poder","-ebilmek"],["querer","istemek / sevmek"],["ir","gitmek"],["venir","gelmek"],["salir","dışarı çıkmak"],["llegar","varmak / ulaşmak"],["volver","dönmek"],["ser","olmak (kimlik/özellik)"],["estar","olmak / bulunmak"],["tener","sahip olmak"],["hacer","yapmak"],["poner","koymak"],["decir","söylemek"],["saber","bilmek"],["ver","görmek"],["pedir","istemek / sipariş vermek"],["dormir","uyumak"],["jugar","oynamak"],["pensar","düşünmek"]],"examples":[["Yo voy al trabajo.","Ben işe gidiyorum."],["Ella puede hablar español.","O İspanyolca konuşabiliyor."],["Tengo dos hermanos.","İki kardeşim var."]],"quiz":[{"q":"Yo ___ al cine. (ir)","options":["voy","vas","va","vamos"],"a":0,"why":"Yo + ir → voy."},{"q":"Yo ___ la tarea. (hacer)","options":["hace","hago","hacer","haces"],"a":1,"why":"Yo + hacer → hago."},{"q":"Ella ___ venir. (poder)","options":["puedo","puede","puedes","podemos"],"a":1,"why":"Ella + poder → puede."},{"q":"Yo ___ dos hermanos. (tener)","options":["tengo","tiene","tenemos","tenéis"],"a":0,"why":"Yo + tener → tengo."},{"q":"Nosotros ___ al trabajo. (ir)","options":["voy","van","vamos","vais"],"a":2,"why":"Nosotros + ir → vamos."},{"q":"Yo ___ de casa a las ocho. (salir)","options":["salo","salgo","sale","salir"],"a":1,"why":"Yo + salir → salgo."}],"sentences":[{"tr":"Ben işe gidiyorum.","es":"Yo voy al trabajo."},{"tr":"O İspanyolca konuşabiliyor.","es":"Ella puede hablar español."},{"tr":"İki kardeşim var.","es":"Tengo dos hermanos."},{"tr":"Saat sekizde evden çıkıyorum.","es":"Salgo de casa a las ocho."}]},{"id":"gustar","no":15,"level":"A1","title":"Gustar","icon":"❤️","summary":"Me gusta / me gustan ile hoşlandığın şeyleri söyle.","theory":"\n<h3>Gustar nasıl çalışır?</h3>\n<p>Türkçedeki “ben X'i seviyorum” mantığından farklı olarak, İspanyolcada yapı kabaca “X bana hoş geliyor” gibidir.</p>\n<p><b>Me gusta</b> + tekil isim veya fiil: <b>Me gusta el café. Me gusta leer.</b></p>\n<p><b>Me gustan</b> + çoğul isim: <b>Me gustan los gatos.</b></p>\n<p>Kişiye göre: <b>me, te, le, nos, os, les</b>. Olumsuz: <b>No me gusta...</b></p>\n","vocab":[["el perro","köpek"],["el gato","kedi"],["la vaca","inek"],["el caballo","at"],["la oveja","koyun"],["el cerdo","domuz"],["la gallina","tavuk"],["el pollito","civciv"],["el conejo","tavşan"],["el elefante","fil"],["la jirafa","zürafa"],["el león","aslan"],["el mono","maymun"],["el panda","panda"],["la tortuga","kaplumbağa"],["el oso","ayı"],["el zorro","tilki"],["el cocodrilo","timsah"],["la cebra","zebra"],["el pingüino","penguen"],["la manzana","elma"],["el plátano","muz"],["las uvas","üzüm"],["la naranja","portakal"],["la fresa","çilek"],["la pera","armut"],["la sandía","karpuz"],["la piña","ananas"],["el melocotón","şeftali"],["las cerezas","kiraz"],["el mango","mango"],["el limón","limon"],["el kiwi","kivi"],["la papaya","papaya"],["los arándanos","yaban mersini"],["el aguacate","avokado"],["el coco","hindistan cevizi"],["la granada","nar"],["la frambuesa","ahududu"],["el melón","kavun"],["la zanahoria","havuç"],["el tomate","domates"],["la patata","patates"],["el pepino","salatalık"],["el maíz","mısır"],["el brócoli","brokoli"],["la coliflor","karnabahar"],["la cebolla","soğan"],["el ajo","sarımsak"],["el pimiento","biber"],["la lechuga","marul"],["la berenjena","patlıcan"],["las judías verdes","fasulye"],["los guisantes","bezelye"],["el champiñón","mantar"],["las espinacas","ıspanak"]],"examples":[["Me gusta la sandía.","Karpuzu seviyorum."],["Me gustan los gatos.","Kedileri seviyorum."],["No me gusta el brócoli.","Brokoliyi sevmiyorum."]],"quiz":[{"q":"Tekil isimle hangisi kullanılır?","options":["Me gustan","Me gusta","Me gusto","Gusta me"],"a":1,"why":"Tekil isim veya fiil ile me gusta."},{"q":"Me ___ los gatos.","options":["gusta","gustan","gusto","gustas"],"a":1,"why":"Los gatos çoğul olduğu için gustan."},{"q":"“Okumayı seviyorum” hangisi?","options":["Me gustan leer.","Me gusta leer.","Yo gusta leer.","Me gusto leer."],"a":1,"why":"Fiil infinitivo ile gusta tekil kullanılır."},{"q":"“Kedileri sevmiyorum”?","options":["No me gustan los gatos.","No gustan me los gatos.","Me no gustan los gatos.","No me gusta los gatos."],"a":0,"why":"Olumsuz no + me + gustan."},{"q":"Tú için dolaylı zamir hangisi?","options":["me","te","le","nos"],"a":1,"why":"Tú → te."}],"sentences":[{"tr":"Karpuzu seviyorum.","es":"Me gusta la sandía."},{"tr":"Kedileri seviyorum.","es":"Me gustan los gatos."},{"tr":"Brokoliyi sevmiyorum.","es":"No me gusta el brócoli."},{"tr":"Okumayı seviyorum.","es":"Me gusta leer."}]},{"id":"muy-mucho","no":16,"level":"A1","title":"Muy, Mucho, Mucha, Muchos, Muchas","icon":"📊","summary":"“Çok” anlamındaki muy ve mucho ailesinin farkını öğren.","theory":"\n<h3>Muy mu, mucho mu?</h3>\n<p><b>Muy</b> sıfat veya zarfın önüne gelir ve değişmez: <b>muy alto, muy rápido, muy bien</b>.</p>\n<p><b>Mucho/a/os/as</b> isimlerle miktar bildirir ve isimle uyum gösterir: <b>mucho tiempo, mucha agua, muchos amigos, muchas sillas</b>.</p>\n<p>Fiilden sonra “çok” anlamında <b>mucho</b> değişmeden kullanılabilir: <b>Trabajo mucho.</b></p>\n","vocab":[["muy","çok (sıfat/zarfla)"],["mucho","çok / fazla (eril tekil veya fiilden sonra)"],["mucha","çok / fazla (dişil tekil)"],["muchos","birçok (eril çoğul)"],["muchas","birçok (dişil çoğul)"],["poco","az"],["poca","az (dişil)"],["pocos","az sayıda (eril çoğul)"],["pocas","az sayıda (dişil çoğul)"],["tiempo","zaman"],["agua","su"],["amigos","arkadaşlar"],["sillas","sandalyeler"],["dinero","para"],["hambre","açlık"],["trabajo","iş"]],"examples":[["Estoy muy cansada.","Çok yorgunum."],["Tengo muchos amigos.","Çok arkadaşım var."],["Hay mucha gente aquí.","Burada çok insan var."]],"quiz":[{"q":"Estoy ___ cansada.","options":["mucho","muy","muchas","mucha"],"a":1,"why":"Sıfat cansada önünde muy."},{"q":"Tengo ___ amigos.","options":["muy","mucho","muchos","muchas"],"a":2,"why":"Amigos eril çoğul: muchos."},{"q":"Hay ___ sillas.","options":["muy","mucho","muchos","muchas"],"a":3,"why":"Sillas dişil çoğul: muchas."},{"q":"Tengo ___ tiempo.","options":["muy","mucho","muchos","muchas"],"a":1,"why":"Tiempo eril tekil/sayılamayan: mucho."},{"q":"Trabajo ___.","options":["muy","mucho","muchos","mucha"],"a":1,"why":"Fiilden sonra miktar/derece: trabajo mucho."}],"sentences":[{"tr":"Çok yorgunum.","es":"Estoy muy cansada."},{"tr":"Çok arkadaşım var.","es":"Tengo muchos amigos."},{"tr":"Burada çok insan var.","es":"Hay mucha gente aquí."},{"tr":"Çok çalışıyorum.","es":"Trabajo mucho."}]},{"id":"cuerpo-doler","no":17,"level":"A1","title":"Cuerpo Humano + Doler","icon":"🩺","summary":"Vücudun bölümlerini öğren ve ağrı ifade et: me duele / me duelen.","theory":"\n<h3>Doler</h3>\n<p><b>Me duele + tekil</b>: <b>Me duele la cabeza.</b></p>\n<p><b>Me duelen + çoğul</b>: <b>Me duelen los pies.</b></p>\n<p>Kişiye göre: <b>me, te, le, nos, os, les</b>. Sorarken: <b>¿Te duele la espalda?</b></p>\n<p>Doler, gustar gibi çalışır; fiil “ağrıyan şeyin” tekil/çoğul olmasına göre <b>duele/duelen</b> olur.</p>\n","vocab":[["los ojos","gözler"],["las orejas","kulaklar"],["la nariz","burun"],["la boca","ağız"],["los dientes","dişler"],["el pelo","saç"],["la cara","yüz"],["la cabeza","baş"],["las cejas","kaşlar"],["la lengua","dil"],["el cuello","boyun"],["los brazos","kollar"],["las manos","eller"],["los dedos de la mano","el parmakları"],["el torso","gövde"],["la barriga","karın"],["la espalda","sırt"],["las piernas","bacaklar"],["los pies","ayaklar"],["los dedos del pie","ayak parmakları"],["el corazón","kalp"],["doler","ağrımak"],["el dolor","ağrı"]],"examples":[["Me duele la cabeza.","Başım ağrıyor."],["Me duelen los pies.","Ayaklarım ağrıyor."],["¿Te duele la espalda?","Sırtın ağrıyor mu?"]],"quiz":[{"q":"Me ___ la cabeza.","options":["duelen","duele","dolo","doler"],"a":1,"why":"La cabeza tekil → duele."},{"q":"Me ___ los pies.","options":["duele","duelen","dolen","dolor"],"a":1,"why":"Los pies çoğul → duelen."},{"q":"“sırt” hangisi?","options":["la barriga","la espalda","el cuello","la cara"],"a":1,"why":"La espalda = sırt."},{"q":"“eller” hangisi?","options":["las manos","los brazos","los pies","los ojos"],"a":0,"why":"Las manos = eller."},{"q":"“Sırtın ağrıyor mu?” hangisi?","options":["¿Te duelen la espalda?","¿Te duele la espalda?","¿Me duele la espalda?","¿Tu espalda dolor?"],"a":1,"why":"Te + duele + tekil la espalda."}],"sentences":[{"tr":"Başım ağrıyor.","es":"Me duele la cabeza."},{"tr":"Ayaklarım ağrıyor.","es":"Me duelen los pies."},{"tr":"Sırtın ağrıyor mu?","es":"¿Te duele la espalda?"},{"tr":"Dişlerim ağrıyor.","es":"Me duelen los dientes."}]},{"id":"posesivos","no":18,"level":"A1","title":"Los Posesivos","icon":"👨‍👩‍👧","summary":"Mi, tu, su, nuestro... ile sahiplik; aile üyeleriyle bol pratik.","theory":"\n<h3>Posesivos</h3>\n<p>İsmin önünde kullanılan temel sahiplik sıfatları: <b>mi/mis</b> benim, <b>tu/tus</b> senin, <b>su/sus</b> onun/sizin/onların.</p>\n<p><b>Nuestro/a/os/as</b> bizim ve <b>vuestro/a/os/as</b> sizin biçimleri sahip olunan isme göre cinsiyet/sayı uyumu gösterir.</p>\n<p>Örnek: <b>mi madre, tu padre, sus hermanos, nuestra abuela, nuestros padres.</b></p>\n<p><b>de</b> ile de sahiplik kurulabilir: <b>la madre de Ana</b> = Ana'nın annesi.</p>\n","vocab":[["la madre","anne"],["el padre","baba"],["la hermana","kız kardeş"],["el hermano","erkek kardeş"],["la abuela","büyükanne"],["el abuelo","büyükbaba"],["la tía","teyze / hala"],["el tío","amca / dayı"],["la prima","kız kuzen"],["el primo","erkek kuzen"],["la hija","kız evlat"],["el hijo","erkek evlat"],["el sobrino","erkek yeğen"],["la sobrina","kız yeğen"],["el bebé","bebek"],["la mascota","evcil hayvan"],["los padres","anne-baba / ebeveynler"],["los abuelos","büyükanne ve büyükbaba"],["los hermanos","kardeşler"],["la familia","aile"],["mi / mis","benim"],["tu / tus","senin"],["su / sus","onun / sizin / onların"],["nuestro / nuestra","bizim"],["nuestros / nuestras","bizim (çoğul)"],["vuestro / vuestra","sizin"],["vuestros / vuestras","sizin (çoğul)"]],"examples":[["Mi madre es profesora.","Benim annem öğretmen."],["Tu hermano es alto.","Senin erkek kardeşin uzun boylu."],["Nuestra abuela vive en Madrid.","Bizim büyükannemiz Madrid'de yaşıyor."]],"quiz":[{"q":"___ madre = benim annem","options":["Mi","Tu","Su","Nuestra"],"a":0,"why":"Mi = benim (tekil isim önünde)."},{"q":"___ hermanos = senin kardeşlerin","options":["Mi","Tus","Su","Nuestro"],"a":1,"why":"Tu'nun çoğul isim önündeki biçimi tus."},{"q":"“bizim annemiz” hangisi?","options":["nuestro madre","nuestra madre","nuestros madre","mi madre"],"a":1,"why":"Madre dişil tekil → nuestra madre."},{"q":"“bizim erkek kardeşlerimiz” hangisi?","options":["nuestro hermanos","nuestra hermanos","nuestros hermanos","sus hermano"],"a":2,"why":"Hermanos eril çoğul → nuestros."},{"q":"“Ana'nın annesi” hangisi?","options":["la madre a Ana","la madre de Ana","la madre en Ana","la madre para Ana"],"a":1,"why":"Sahiplik de ile kurulabilir."},{"q":"Su madre cümlesindeki su ne anlama gelebilir?","options":["Sadece benim","Sadece senin","Onun / sizin / onların","Sadece bizim"],"a":2,"why":"Su bağlama göre onun, sizin veya onların olabilir."}],"sentences":[{"tr":"Benim annem öğretmen.","es":"Mi madre es profesora."},{"tr":"Senin erkek kardeşin uzun boylu.","es":"Tu hermano es alto."},{"tr":"Bizim büyükannemiz Madrid'de yaşıyor.","es":"Nuestra abuela vive en Madrid."},{"tr":"Onların ebeveynleri İspanyol.","es":"Sus padres son españoles."},{"tr":"Ana'nın annesi doktor.","es":"La madre de Ana es médica."}]},{"id":"adjetivos","no":19,"level":"A1","title":"Adjetivos","icon":"🎨","summary":"Sıfatlarda cinsiyet/sayı uyumu ve renkleri sıfat olarak kullanma.","theory":"\n<h3>Sıfat uyumu</h3>\n<p>Sıfatlar çoğunlukla isimden sonra gelir: <b>una casa grande, una camiseta roja</b>.</p>\n<p><b>-o</b> ile biten birçok sıfat cinsiyete göre değişir: rojo/roja. <b>-e</b> veya sessizle biten birçok sıfat aynı kalır: inteligente, fácil.</p>\n<p>Çoğul isimde sıfat da çoğul olur: <b>zapatos negros, camisetas rojas</b>.</p>\n","vocab":[["rojo / roja","kırmızı"],["azul","mavi"],["amarillo / amarilla","sarı"],["verde","yeşil"],["naranja","turuncu"],["morado / morada","mor"],["rosa","pembe"],["marrón","kahverengi"],["negro / negra","siyah"],["blanco / blanca","beyaz"],["gris","gri"],["beige","bej"],["grande","büyük"],["pequeño / pequeña","küçük"],["bonito / bonita","güzel"],["feo / fea","çirkin"],["inteligente","zeki"],["interesante","ilginç"],["cómodo / cómoda","rahat"],["antiguo / antigua","eski"],["moderno / moderna","modern"]],"examples":[["Una camiseta roja.","Kırmızı bir tişört."],["Los zapatos negros.","Siyah ayakkabılar."],["Mi hermana es inteligente.","Kız kardeşim zeki."]],"quiz":[{"q":"una camiseta ___","options":["rojo","roja","rojos","rojas"],"a":1,"why":"Camiseta dişil tekil → roja."},{"q":"los zapatos ___","options":["negro","negra","negros","negras"],"a":2,"why":"Zapatos eril çoğul → negros."},{"q":"una chica ___","options":["inteligente","inteligenta","inteligentes","inteligento"],"a":0,"why":"Inteligente tekil biçimde cinsiyete göre değişmez."},{"q":"“büyük bir ev” hangisi?","options":["una grande casa","una casa grande","un casa grande","una casa grandes"],"a":1,"why":"Temel kullanımda sıfat isimden sonra: una casa grande."},{"q":"las camisetas ___","options":["rojo","roja","rojos","rojas"],"a":3,"why":"Dişil çoğul → rojas."}],"sentences":[{"tr":"Kırmızı bir tişört.","es":"Una camiseta roja."},{"tr":"Siyah ayakkabılar.","es":"Los zapatos negros."},{"tr":"Kız kardeşim zeki.","es":"Mi hermana es inteligente."},{"tr":"Büyük ve modern bir ev.","es":"Una casa grande y moderna."}]},{"id":"reflexivos","no":20,"level":"A2","title":"Reflexivos","icon":"🪞","summary":"Günlük rutinlerde me/te/se/nos/os/se ile dönüşlü fiiller.","theory":"\n<h3>Verbos reflexivos</h3>\n<p>Dönüşlü fiillerde eylem özneye geri döner. Zamirler: <b>me, te, se, nos, os, se</b>.</p>\n<p>Örnek: <b>me levanto, te duchas, se viste, nos acostamos</b>.</p>\n<p>Dönüşlü zamir genellikle çekimli fiilden önce gelir: <b>Yo me levanto a las siete.</b></p>\n<p>Llamar/llamarse veya ir/irse gibi bazı fiiller dönüşlü olduğunda anlam değiştirebilir.</p>\n","vocab":[["despertarse","uyanmak"],["levantarse","kalkmak"],["lavarse los dientes","dişlerini fırçalamak"],["ducharse","duş almak"],["bañarse","banyo yapmak"],["lavarse la cara","yüzünü yıkamak"],["maquillarse","makyaj yapmak"],["afeitarse","tıraş olmak"],["peinarse","saçını taramak"],["vestirse / ponerse la ropa","giyinmek"],["desvestirse / quitarse la ropa","soyunmak"],["mirarse en el espejo","aynaya bakmak"],["acostarse","yatağa girmek"],["dormirse","uykuya dalmak"],["dormir","uyumak"],["despertarse otra vez","tekrar uyanmak"]],"examples":[["Me levanto a las siete.","Saat yedide kalkarım."],["Ella se ducha por la mañana.","O sabah duş alır."],["Nos acostamos tarde.","Geç yatarız."]],"quiz":[{"q":"Yo ___ levanto a las siete.","options":["me","te","se","nos"],"a":0,"why":"Yo → me."},{"q":"Tú ___ duchas por la noche.","options":["me","te","se","os"],"a":1,"why":"Tú → te."},{"q":"Ella ___ viste rápido.","options":["me","te","se","nos"],"a":2,"why":"Él/ella/usted → se."},{"q":"Nosotros ___ acostamos tarde.","options":["se","nos","os","me"],"a":1,"why":"Nosotros → nos."},{"q":"“Ben saat yedide kalkarım” hangisi?","options":["Yo levanto me a las siete.","Yo me levanto a las siete.","Yo se levanto a las siete.","Me levantar a las siete."],"a":1,"why":"Zamir genellikle çekimli fiilden önce gelir."}],"sentences":[{"tr":"Saat yedide kalkarım.","es":"Me levanto a las siete."},{"tr":"O sabah duş alır.","es":"Ella se ducha por la mañana."},{"tr":"Geç yatarız.","es":"Nos acostamos tarde."},{"tr":"Sen dişlerini fırçalarsın.","es":"Te lavas los dientes."}]},{"id":"frecuencia","no":21,"level":"A1","title":"Sıklık Zarfları","icon":"🔁","summary":"Siempre, normalmente, a menudo, a veces, raramente, nunca ile rutin anlat.","theory":"\n<h3>Adverbios de frecuencia</h3>\n<p>Sıklık zarfları bir eylemin ne kadar sık yapıldığını anlatır: <b>siempre</b> her zaman, <b>normalmente</b> normalde, <b>a menudo</b> sık sık, <b>a veces</b> bazen, <b>raramente</b> nadiren, <b>nunca</b> asla.</p>\n<p>Genellikle çekimli fiilden önce veya cümlenin başında kullanılabilir: <b>Siempre desayuno.</b> / <b>Yo siempre desayuno.</b></p>\n<p><b>Nunca</b> olumsuz anlam taşır; çoğu temel cümlede ayrıca “no” gerekmez: <b>Nunca bebo café.</b></p>\n","vocab":[["siempre","her zaman"],["normalmente","normalde"],["a menudo","sık sık"],["a veces","bazen"],["raramente","nadiren"],["nunca","asla"],["desayunar","kahvaltı yapmak"],["comer / almorzar","yemek / öğle yemeği yemek"],["merendar","ara öğün yemek"],["cenar","akşam yemeği yemek"],["cocinar","yemek pişirmek"],["salir de casa","evden çıkmak"],["llegar a casa","eve varmak"],["ir al trabajo","işe gitmek"],["coger / tomar el autobús","otobüse binmek"],["coger / tomar el taxi","taksiye binmek"],["coger / tomar el metro","metroya binmek"],["montar en bici","bisiklete binmek"],["estudiar","ders çalışmak"],["trabajar","çalışmak"],["ir a clase de español","İspanyolca dersine gitmek"],["ir al supermercado","süpermarkete gitmek"],["hacer la compra","alışveriş yapmak"],["ir de compras","alışverişe çıkmak"],["ir al parque","parka gitmek"],["leer un libro","kitap okumak"],["ver la tele","televizyon izlemek"],["ir a la escuela","okula gitmek"],["tomar un café","kahve içmek"],["salir de noche","gece dışarı çıkmak"],["bailar","dans etmek"],["quedar con amigos","arkadaşlarla buluşmak"],["ir al bar","bara gitmek"],["hacer deporte","spor yapmak"],["dar un paseo / pasear","yürüyüş yapmak"],["ir al gimnasio","spor salonuna gitmek"],["correr","koşmak"]],"examples":[["Siempre me levanto a las siete.","Her zaman saat yedide kalkarım."],["A veces voy al gimnasio.","Bazen spor salonuna giderim."],["Nunca bebo café por la noche.","Gece asla kahve içmem."]],"quiz":[{"q":"“her zaman” hangisi?","options":["a veces","siempre","nunca","raramente"],"a":1,"why":"Siempre = her zaman."},{"q":"“bazen” hangisi?","options":["a veces","a menudo","nunca","normalmente"],"a":0,"why":"A veces = bazen."},{"q":"“asla” hangisi?","options":["siempre","normalmente","raramente","nunca"],"a":3,"why":"Nunca = asla."},{"q":"___ voy al gimnasio. = Bazen spor salonuna giderim.","options":["Siempre","A veces","Nunca","Muy"],"a":1,"why":"A veces = bazen."},{"q":"“Sık sık kitap okurum” hangisi?","options":["A menudo leo un libro.","Nunca leo un libro.","Muy leo un libro.","Muchos leo un libro."],"a":0,"why":"A menudo = sık sık."}],"sentences":[{"tr":"Her zaman saat yedide kalkarım.","es":"Siempre me levanto a las siete."},{"tr":"Bazen spor salonuna giderim.","es":"A veces voy al gimnasio."},{"tr":"Gece asla kahve içmem.","es":"Nunca bebo café por la noche."},{"tr":"Sık sık kitap okurum.","es":"A menudo leo un libro."}]},{"id":"comparativos","no":22,"level":"A2","title":"Comparativos","icon":"📏","summary":"Más que, menos que, tan...como ve mejor/peor ile karşılaştırma.","theory":"\n<h3>Comparativos</h3>\n<p><b>más + sıfat + que</b> = ...den daha: <b>Ana es más alta que Marta.</b></p>\n<p><b>menos + sıfat + que</b> = ...den daha az: <b>Este libro es menos caro que ese.</b></p>\n<p><b>tan + sıfat + como</b> = ... kadar: <b>Luis es tan alto como Pedro.</b></p>\n<p>Düzensiz: <b>bueno → mejor</b>, <b>malo → peor</b>, bazı bağlamlarda <b>grande → mayor</b>, <b>pequeño → menor</b>.</p>\n","vocab":[["más","daha / daha fazla"],["menos","daha az"],["que","-den/-dan / ki"],["tan","... kadar"],["como","gibi / kadar"],["mejor","daha iyi"],["peor","daha kötü"],["mayor","daha büyük / daha yaşlı"],["menor","daha küçük / daha genç"],["alto / alta","uzun boylu"],["bajo / baja","kısa boylu"],["grande","büyük"],["pequeño / pequeña","küçük"],["rápido / rápida","hızlı"],["lento / lenta","yavaş"],["caro / cara","pahalı"],["barato / barata","ucuz"],["fácil","kolay"],["difícil","zor"],["fuerte","güçlü"],["débil","güçsüz"]],"examples":[["Ana es más alta que Marta.","Ana, Marta'dan daha uzun."],["Este libro es menos caro que ese.","Bu kitap şundan daha az pahalı."],["Luis es tan alto como Pedro.","Luis, Pedro kadar uzun."]],"quiz":[{"q":"Ana es ___ alta que Marta.","options":["tan","más","muy","mucho"],"a":1,"why":"Daha ... -den yapısı: más + sıfat + que."},{"q":"Luis es tan alto ___ Pedro.","options":["que","de","como","por"],"a":2,"why":"Eşitlik: tan + sıfat + como."},{"q":"Bueno'nun düzensiz karşılaştırması?","options":["más bueno","mejor","mayor","menos bueno"],"a":1,"why":"Bueno → mejor."},{"q":"Malo'nun düzensiz karşılaştırması?","options":["peor","mejor","menor","más malo"],"a":0,"why":"Malo → peor."},{"q":"“daha az pahalı” hangisi?","options":["más caro","menos caro","tan caro","muy caro"],"a":1,"why":"Menos + sıfat."}],"sentences":[{"tr":"Ana, Marta'dan daha uzun.","es":"Ana es más alta que Marta."},{"tr":"Bu kitap şundan daha az pahalı.","es":"Este libro es menos caro que ese."},{"tr":"Luis, Pedro kadar uzun.","es":"Luis es tan alto como Pedro."},{"tr":"Bu restoran daha iyi.","es":"Este restaurante es mejor."}]},{"id":"ir-a","no":23,"level":"A1","title":"IR + A + INFINITIVO","icon":"🚀","summary":"Yakın gelecek planlarını voy a estudiar gibi anlat.","theory":"\n<h3>Yakın gelecek</h3>\n<p>Yapı: <b>ir (çekimli) + a + infinitivo</b>.</p>\n<p><b>Voy a estudiar.</b> Çalışacağım. <b>Vamos a viajar.</b> Seyahat edeceğiz.</p>\n<p>Zaman zarflarıyla doğal kullanılır: <b>hoy, mañana, esta tarde, esta noche, el fin de semana, la semana que viene</b>.</p>\n<p>Buradaki <b>a</b> zorunludur: <b>voy a comer</b>, “voy comer” değil.</p>\n","vocab":[["hoy","bugün"],["mañana","yarın"],["esta tarde","bu öğleden sonra"],["esta noche","bu gece"],["el fin de semana","hafta sonu"],["la semana que viene","gelecek hafta"],["el mes que viene","gelecek ay"],["pronto","yakında"],["viajar","seyahat etmek"],["estudiar","ders çalışmak"],["trabajar","çalışmak"],["comer","yemek"],["cocinar","yemek pişirmek"],["ir de compras","alışverişe çıkmak"],["ir al parque","parka gitmek"],["leer un libro","kitap okumak"],["ver la tele","televizyon izlemek"],["hacer deporte","spor yapmak"],["bailar","dans etmek"],["visitar","ziyaret etmek"]],"examples":[["Voy a estudiar mañana.","Yarın ders çalışacağım."],["Vamos a viajar el fin de semana.","Hafta sonu seyahat edeceğiz."],["Ella va a cocinar esta noche.","O bu gece yemek yapacak."]],"quiz":[{"q":"Yo ___ a estudiar.","options":["voy","vas","va","vamos"],"a":0,"why":"Yo + ir → voy."},{"q":"Nosotros ___ a viajar.","options":["van","vamos","vais","voy"],"a":1,"why":"Nosotros + ir → vamos."},{"q":"Ella va ___ cocinar.","options":["de","en","a","por"],"a":2,"why":"Ir + a + infinitivo."},{"q":"“Yarın ders çalışacağım” hangisi?","options":["Voy estudiar mañana.","Voy a estudiar mañana.","Estoy estudiar mañana.","Soy a estudiar mañana."],"a":1,"why":"Voy a + infinitivo."},{"q":"Ellos ___ a salir esta noche.","options":["va","voy","van","vamos"],"a":2,"why":"Ellos + ir → van."}],"sentences":[{"tr":"Yarın ders çalışacağım.","es":"Voy a estudiar mañana."},{"tr":"Hafta sonu seyahat edeceğiz.","es":"Vamos a viajar el fin de semana."},{"tr":"O bu gece yemek yapacak.","es":"Ella va a cocinar esta noche."},{"tr":"Onlar yarın parka gidecek.","es":"Ellos van a ir al parque mañana."}]},{"id":"tiempo","no":24,"level":"A1","title":"El Tiempo","icon":"🌦️","summary":"Hace sol, llueve, nieva, está nublado, hay tormenta ile hava durumu.","theory":"\n<h3>El tiempo atmosférico</h3>\n<p><b>Hace</b> ile: <b>Hace sol, hace frío, hace calor, hace viento, hace buen/mal tiempo.</b></p>\n<p>Fiil olarak: <b>Llueve</b> (yağmur yağıyor), <b>Nieva</b> (kar yağıyor).</p>\n<p><b>Estar</b> ile: <b>Está nublado.</b> <b>Hay</b> ile: <b>Hay niebla, hay tormenta.</b></p>\n<p>Mevsimlerle: <b>En verano hace mucho calor. En invierno hace frío.</b></p>\n","vocab":[["Hace sol","Güneşli"],["Hace frío","Soğuk"],["Hace calor","Sıcak"],["Llueve / Está lloviendo","Yağmur yağıyor"],["Nieva / Está nevando","Kar yağıyor"],["Está nublado","Bulutlu"],["Hace viento / Está ventoso","Rüzgârlı"],["Hay tormenta / Está tormentoso","Fırtına var"],["Hace buen tiempo","Hava güzel"],["Hace mal tiempo","Hava kötü"],["Hay niebla","Sis var"],["el sol","güneş"],["la lluvia","yağmur"],["la nieve","kar"],["el viento","rüzgâr"],["la nube","bulut"],["la tormenta","fırtına"]],"examples":[["Hoy hace sol.","Bugün güneşli."],["En invierno hace mucho frío.","Kışın çok soğuk olur."],["Hoy está nublado.","Bugün hava bulutlu."]],"quiz":[{"q":"“Güneşli” hangisi?","options":["Hace sol","Hace frío","Llueve","Está nublado"],"a":0,"why":"Hace sol = güneşli."},{"q":"“Yağmur yağıyor” hangisi?","options":["Nieva","Llueve","Hace viento","Hay niebla"],"a":1,"why":"Llueve = yağmur yağıyor."},{"q":"“Bulutlu” hangisi?","options":["Está nublado","Hace calor","Hace sol","Nieva"],"a":0,"why":"Está nublado = bulutlu."},{"q":"“Sis var” hangisi?","options":["Hay niebla","Hace niebla","Está niebla","Llueve niebla"],"a":0,"why":"Hay niebla = sis var."},{"q":"En verano hace ___ calor.","options":["muy","mucho","muchas","mucha"],"a":1,"why":"Hace mucho calor kalıbı."},{"q":"“Fırtına var” hangisi?","options":["Hay tormenta","Hace tormenta","Es tormenta","Tiene tormenta"],"a":0,"why":"Hay tormenta."}],"sentences":[{"tr":"Bugün güneşli.","es":"Hoy hace sol."},{"tr":"Kışın çok soğuk olur.","es":"En invierno hace mucho frío."},{"tr":"Bugün hava bulutlu.","es":"Hoy está nublado."},{"tr":"Fırtına var.","es":"Hay tormenta."}]},{"id":"estar-gerundio","no":25,"level":"A2","title":"Estar + Gerundio","icon":"▶️","summary":"Şu anda devam eden eylemleri estoy hablando gibi anlat.","theory":"\n<h3>Estar + gerundio</h3>\n<p>Şu anda devam eden eylem için: <b>estar (çekimli) + gerundio</b>.</p>\n<p><b>-ar → -ando</b>: hablar → hablando, trabajar → trabajando.</p>\n<p><b>-er / -ir → -iendo</b>: comer → comiendo, vivir → viviendo.</p>\n<p>Bazı düzensizler: <b>leer → leyendo, dormir → durmiendo, pedir → pidiendo</b>.</p>\n<p>Örnek: <b>Estoy estudiando ahora.</b> / <b>Ellos están comiendo.</b></p>\n","vocab":[["hablando","konuşuyor"],["comiendo","yiyor"],["viviendo","yaşıyor"],["trabajando","çalışıyor"],["estudiando","ders çalışıyor"],["leyendo","okuyor"],["escribiendo","yazıyor"],["bebiendo","içiyor"],["durmiendo","uyuyor"],["pidiendo","istiyor / sipariş veriyor"],["escuchando","dinliyor"],["corriendo","koşuyor"],["cocinando","yemek yapıyor"],["bailando","dans ediyor"],["viendo","izliyor / görüyor"],["ahora","şimdi"],["en este momento","şu anda"]],"examples":[["Estoy estudiando ahora.","Şu anda ders çalışıyorum."],["Ellos están comiendo.","Onlar yemek yiyor."],["Mi madre está cocinando.","Annem yemek yapıyor."]],"quiz":[{"q":"hablar → gerundio?","options":["habliendo","hablando","hablado","hablarando"],"a":1,"why":"-ar fiilleri → -ando."},{"q":"comer → gerundio?","options":["comando","comiendo","comido","comerando"],"a":1,"why":"-er fiilleri → -iendo."},{"q":"Yo ___ estudiando.","options":["soy","estoy","tengo","hay"],"a":1,"why":"Estar + gerundio: estoy estudiando."},{"q":"Ellos ___ comiendo.","options":["está","estoy","están","son"],"a":2,"why":"Ellos + estar → están."},{"q":"leer → gerundio?","options":["leiendo","leyendo","leando","leído"],"a":1,"why":"Leer → leyendo."},{"q":"dormir → gerundio?","options":["dormiendo","durmiendo","dormando","duermiendo"],"a":1,"why":"Düzensiz kök değişimi: durmiendo."}],"sentences":[{"tr":"Şu anda ders çalışıyorum.","es":"Estoy estudiando ahora."},{"tr":"Onlar yemek yiyor.","es":"Ellos están comiendo."},{"tr":"Annem yemek yapıyor.","es":"Mi madre está cocinando."},{"tr":"Sen kitap okuyorsun.","es":"Estás leyendo un libro."}]}];

function load(){try{return Object.assign({name:'Sare',xp:0,streak:1,correct:0,wrong:0,lastStudy:'',lessonWords:{},spanishLearned:[],completed:{}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {name:'Sare',xp:0,streak:1,correct:0,wrong:0,lastStudy:'',lessonWords:{},spanishLearned:[],completed:{}}}}
let state=load();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:"]/g,'').replace(/\s+/g,' ').trim();
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x};
const lessonById=id=>LESSONS.find(x=>x.id===id);
function save(){localStorage.setItem(KEY,JSON.stringify(state));chrome()}
function today(){return new Date().toISOString().slice(0,10)}
function study(){const t=today();if(state.lastStudy===t)return;if(state.lastStudy){const d=Math.round((new Date(t)-new Date(state.lastStudy))/86400000);state.streak=d===1?(state.streak||1)+1:1}else state.streak=1;state.lastStudy=t}
function award(n){state.xp+=n;study();save()}
function record(ok,n=10){if(ok){state.correct++;award(n)}else{state.wrong++;study();save()}}
function accuracy(){const t=state.correct+state.wrong;return t?Math.round(state.correct/t*100):0}
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1900)}
function chrome(){document.getElementById('xp').textContent=state.xp+' XP';document.getElementById('sideXp').textContent=state.xp+' XP';document.getElementById('streak').textContent=state.streak||1;document.getElementById('avatar').textContent=(state.name||'S').trim()[0]?.toUpperCase()||'S';document.getElementById('sideLearned').textContent=`${state.spanishLearned.length} / ${WORDS.length||3000}`;document.getElementById('sideBar').style.width=(WORDS.length?Math.min(100,state.spanishLearned.length/WORDS.length*100):0)+'%'}
function setNav(r){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===r))}
function go(r){route=r;selectedLesson=null;practiceLesson=null;practiceMode=null;vocabLesson=null;vocabQuiz=null;allQuiz=null;setNav(r);render();window.scrollTo({top:0,behavior:'smooth'})}
function speak(text){if(!('speechSynthesis'in window)){toast('Tarayıcı seslendirmeyi desteklemiyor.');return}const voices=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('es'));if(!voices.length){toast('Cihazında İspanyolca ses bulunamadı.');return}const voice=voices.find(v=>v.lang.toLowerCase().startsWith('es-es'))||voices[0];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice.lang;u.voice=voice;u.rate=.86;speechSynthesis.speak(u)}
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}

 return `<div class="course-grid">${LESSONS.map(l=>`<button class="course-card" data-${action}="${l.id}"><span class="count">${l.level}</span><div class="folder">${l.icon}</div><h3>${l.no}. DERS · ${esc(l.title)}</h3><p>${esc(l.summary)}</p></button>`).join('')}</div>`
}

 <div class="stats"><div class="stat"><b>25</b><span>ders</span></div><div class="stat"><b>${WORDS.length||3000}</b><span>Spanish 3000 kelimesi</span></div><div class="stat"><b>${lessonLearned}</b><span>ders kelimesi öğrenildi</span></div><div class="stat"><b>%${accuracy()}</b><span>doğruluk</span></div></div>
 <section class="section"><div class="section-title"><div><h2>Ders sırası</h2><p>Her ders senin verdiğin sırayla ilerler.</p></div><span class="pill">1 → 25</span></div>${lessonCards('quick')}</section>`;
 view.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(b.dataset.jump));

 <article class="lesson-shell"><div class="lesson-copy">${l.theory}</div>
 <section class="section"><div class="section-title"><div><h2>Örnekler</h2><p>Hoparlöre basarak İspanyolca dinle.</p></div></div><div class="examples">${l.examples.map(x=>`<div class="example"><div class="es">${esc(x[0])}</div><button class="speak" data-speak="${esc(x[0])}">🔊</button><div class="tr">${esc(x[1])}</div></div>`).join('')}</div></section>
 <section class="section"><div class="section-title"><div><h2>Bu dersin kelimeleri</h2><p>Alıştırmalarda bu kelimeler tekrar karşına çıkar.</p></div><button class="ghost" id="allLessonWords">Kelime çalışmasına geç →</button></div><div class="word-chips">${l.vocab.slice(0,34).map(w=>`<button class="word-chip" data-speak="${esc(w[0])}"><b>${esc(w[0])}</b> · ${esc(w[1])} 🔊</button>`).join('')}</div>${l.vocab.length>34?`<p class="lead" style="margin-top:12px">+ ${l.vocab.length-34} kelime daha kelime çalışması bölümünde.</p>`:''}</section>
 <div class="actions"><button class="primary" id="goPractice">Bu dersin alıştırmalarını yap →</button><button class="secondary" id="goVocab">Kelimeleri ezberle</button></div></article>`;
 document.getElementById('backTopics').onclick=()=>{selectedLesson=null;topics()};view.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));
 const toV=()=>{route='vocab';vocabLesson=l;vocabIndex=0;vocabMode='cards';setNav('vocab');vocab();window.scrollTo(0,0)};
 document.getElementById('allLessonWords').onclick=toV;document.getElementById('goVocab').onclick=toV;

function practice(){
 if(!practiceLesson && !practiceMode){
  view.innerHTML=`<div class="page-head"><div><div class="eyebrow">Konuya göre egzersiz</div><h1>Konu Alıştırması</h1><p class="lead">Karışık olmak zorunda değil. Önce dersini seç; sonra gramer, kelime, dinleme, cümle kurma veya çeviri çalış.</p></div></div>

  ${lessonCards('practice')}`;
  document.getElementById('a1mixed').onclick=()=>startMixed(LESSONS.filter(l=>l.level==='A1'),'A1 Karışık');

  view.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{practiceLesson=lessonById(b.dataset.practice);practiceMode=null;practice();window.scrollTo(0,0)});return

 if(practiceLesson && !practiceMode){
  const l=practiceLesson;
  view.innerHTML=`<div class="page-head"><div><button class="back" id="backPractice">← Ders seç</button><div class="eyebrow" style="margin-top:16px">${l.no}. ders · ${l.level}</div><h1>${l.icon} ${esc(l.title)}</h1><p class="lead">Konuyu iyice oturtmak için farklı egzersiz türlerinden çalış.</p></div></div>
  <div class="mode-grid">
   <button class="mode-card" data-mode="grammar"><span class="big">🧩</span><b>Gramer Testi</b><small>Konu kurallarından çoktan seçmeli sorular.</small></button>
   <button class="mode-card" data-mode="words"><span class="big">🧠</span><b>Kelime Testi</b><small>Bu derse ait İspanyolca → Türkçe.</small></button>
   <button class="mode-card" data-mode="listen"><span class="big">🎧</span><b>Dinle & Bul</b><small>Kelimeyi dinle, doğru anlamı seç.</small></button>
   <button class="mode-card" data-mode="sentence"><span class="big">✎</span><b>Cümle Kur</b><small>Karışık kelimeleri doğru sıraya diz.</small></button>
   <button class="mode-card" data-mode="translate"><span class="big">⌨️</span><b>Çeviri Yaz</b><small>Türkçe cümleyi İspanyolca yaz.</small></button>
  </div>`;
  document.getElementById('backPractice').onclick=()=>{practiceLesson=null;practiceMode=null;practice()};
  view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{practiceMode=b.dataset.mode;qIndex=0;answered=false;currentQ=null;sentenceTokens=[];sentenceChosen=[];practice();window.scrollTo(0,0)});return
 }
 if(practiceMode==='grammar') renderGrammar();
 if(practiceMode==='words') renderLessonWordQuiz(false);
 if(practiceMode==='listen') renderLessonWordQuiz(true);
 if(practiceMode==='sentence') renderSentence();

function backToModes(){practiceMode=null;currentQ=null;answered=false;sentenceTokens=[];sentenceChosen=[];practice()}
function startMixed(ls,title){practiceLesson={id:'mixed',title,icon:'🎯',no:'',level:'A1',quiz:shuffle(ls.flatMap(l=>l.quiz.map(q=>({...q,_lesson:l.title}))))};practiceMode='mixed';qIndex=0;answered=false;currentQ=null;renderTopicQuiz()}
function renderGrammar(){const l=practiceLesson;currentQ=l.quiz[qIndex%l.quiz.length];renderTopicQuiz()}
function renderTopicQuiz(){
 const l=practiceLesson,q=currentQ||(l.quiz[qIndex%l.quiz.length]);currentQ=q;
 view.innerHTML=`<div class="page-head"><div><button class="back" id="backModes">← ${practiceMode==='mixed'?'Alıştırmalar':'Egzersiz türleri'}</button><div class="eyebrow" style="margin-top:16px">Gramer testi</div><h1>${esc(l.title)}</h1></div><span class="pill">${qIndex+1} / ${l.quiz.length}</span></div>
 <div class="quiz-shell"><div class="quiz-top"><span>${q._lesson?esc(q._lesson):'Konu sorusu'}</span><span>+10 XP</span></div><div class="question">${esc(q.q)}</div><div class="options">${q.options.map((o,i)=>`<button class="option" data-opt="${i}">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="nextline"><button id="nextQ" class="primary" style="display:none">Sonraki →</button></div></div>`;
 document.getElementById('backModes').onclick=()=>{if(practiceMode==='mixed'){practiceLesson=null;practiceMode=null;currentQ=null;practice()}else backToModes()};
 view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const i=Number(b.dataset.opt),ok=i===q.a;view.querySelectorAll('[data-opt]').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Doğru!':'✕ Yanlış.'}</strong>${esc(q.why)}`;document.getElementById('nextQ').style.display='inline-block';record(ok,10)});
 document.getElementById('nextQ').onclick=()=>{qIndex=(qIndex+1)%l.quiz.length;answered=false;currentQ=null;if(practiceMode==='grammar')renderGrammar();else renderTopicQuiz()}
}
function createWordQuiz(pool){const target=pool[Math.floor(Math.random()*pool.length)],others=shuffle(pool.filter(x=>x[0]!==target[0])).slice(0,3);return {target,choices:shuffle([target,...others]),answered:false}}
function renderLessonWordQuiz(listen){
 const l=practiceLesson;if(!currentQ)currentQ=createWordQuiz(l.vocab);const q=currentQ;
 view.innerHTML=`<div class="page-head"><div><button class="back" id="backModes">← Egzersiz türleri</button><div class="eyebrow" style="margin-top:16px">${listen?'Dinleme':'Kelime testi'}</div><h1>${l.icon} ${esc(l.title)}</h1></div><span class="pill">${l.vocab.length} kelimelik havuz</span></div>
 <div class="quiz-shell"><div class="quiz-top"><span>${listen?'Dinle ve anlamı bul':'İspanyolca → Türkçe'}</span><span>+8 XP</span></div>
 <div class="question" style="text-align:center;font-size:${listen?'28px':'39px'}">${listen?'<button class="big-speak" id="listenBtn">🔊</button>':esc(q.target[0])}</div><div class="hint" style="text-align:center">${listen?'Hoparlöre basıp kelimeyi dinle.':'Doğru Türkçe anlamı seç.'}</div>
 <div class="options">${q.choices.map((x,i)=>`<button class="option" data-opt="${i}">${esc(x[1])}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="nextline"><button id="nextQ" class="primary" style="display:none">Yeni kelime →</button></div></div>`;
 document.getElementById('backModes').onclick=backToModes;if(listen){document.getElementById('listenBtn').onclick=()=>speak(q.target[0]);setTimeout(()=>speak(q.target[0]),180)}
 view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(q.answered)return;q.answered=true;const i=Number(b.dataset.opt),ok=q.choices[i][0]===q.target[0];view.querySelectorAll('[data-opt]').forEach((x,j)=>{x.disabled=true;if(q.choices[j][0]===q.target[0])x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Doğru!':'✕ Yanlış.'}</strong>${esc(q.target[0])} = ${esc(q.target[1])}`;document.getElementById('nextQ').style.display='inline-block';record(ok,8)});
 document.getElementById('nextQ').onclick=()=>{currentQ=null;renderLessonWordQuiz(listen)}
}
function makeSentence(){sentenceItem=practiceLesson.sentences[qIndex%practiceLesson.sentences.length];sentenceChosen=[];sentenceTokens=shuffle(sentenceItem.es.split(/\s+/).map((text,i)=>({id:i,text,used:false})))}
function renderSentence(){
 if(!sentenceItem||!sentenceTokens.length)makeSentence();const l=practiceLesson;
 view.innerHTML=`<div class="page-head"><div><button class="back" id="backModes">← Egzersiz türleri</button><div class="eyebrow" style="margin-top:16px">Cümle kurma</div><h1>${l.icon} ${esc(l.title)}</h1></div><span class="pill">${qIndex+1} / ${l.sentences.length}</span></div>
 <div class="quiz-shell"><div class="quiz-top"><span>Türkçesi</span><span>+15 XP</span></div><div class="question">${esc(sentenceItem.tr)}</div><div class="hint">Kelimelere doğru sırayla dokun.</div><div class="sentence-zone" id="zone"></div><div class="bank" id="bank"></div><div class="actions" style="justify-content:space-between"><button class="ghost" id="resetSentence">↺ Sıfırla</button><button class="primary" id="checkSentence">Kontrol et</button></div><div id="feedback" class="feedback"></div></div>`;
 document.getElementById('backModes').onclick=backToModes;paintSentence();document.getElementById('resetSentence').onclick=()=>{makeSentence();renderSentence()};document.getElementById('checkSentence').onclick=checkSentence;
}
function paintSentence(){const z=document.getElementById('zone'),b=document.getElementById('bank');z.innerHTML=sentenceChosen.map((t,i)=>`<button class="token" data-chosen="${i}">${esc(t.text)}</button>`).join('');b.innerHTML=sentenceTokens.map((t,i)=>`<button class="token ${t.used?'used':''}" data-token="${i}">${esc(t.text)}</button>`).join('');b.querySelectorAll('[data-token]').forEach(x=>x.onclick=()=>{const t=sentenceTokens[Number(x.dataset.token)];if(t.used)return;t.used=true;sentenceChosen.push(t);paintSentence()});z.querySelectorAll('[data-chosen]').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.chosen),t=sentenceChosen[i];t.used=false;sentenceChosen.splice(i,1);paintSentence()})}
function checkSentence(){const user=sentenceChosen.map(t=>t.text).join(' '),ok=norm(user)===norm(sentenceItem.es),f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');if(ok){f.innerHTML=`<strong>✓ Doğru!</strong>${esc(sentenceItem.es)} <button class="primary" id="nextSentence" style="float:right;padding:7px 10px">Sonraki →</button>`;record(true,15);document.getElementById('nextSentence').onclick=()=>{qIndex=(qIndex+1)%practiceLesson.sentences.length;sentenceItem=null;sentenceTokens=[];renderSentence()}}else{f.innerHTML=`<strong>✕ Tekrar dene.</strong>Doğru cümle: <b>${esc(sentenceItem.es)}</b>`;record(false,0)}}

 const l=practiceLesson,item=l.sentences[qIndex%l.sentences.length];
 view.innerHTML=`<div class="page-head"><div><button class="back" id="backModes">← Egzersiz türleri</button><div class="eyebrow" style="margin-top:16px">Yazma & çeviri</div><h1>${l.icon} ${esc(l.title)}</h1></div><span class="pill">${qIndex+1} / ${l.sentences.length}</span></div>
 <div class="quiz-shell"><div class="quiz-top"><span>Türkçe → İspanyolca</span><span>+15 XP</span></div><div class="question">${esc(item.tr)}</div><div class="hint">Cümleyi İspanyolca yaz. Noktalama ve aksan farklarında tolerans var.</div><input class="answer-input" id="translateInput" autocomplete="off" placeholder="İspanyolca cevabını yaz..."><div class="actions"><button class="primary" id="checkTranslate">Kontrol et</button></div><div id="feedback" class="feedback"></div></div>`;
 document.getElementById('backModes').onclick=backToModes;const inp=document.getElementById('translateInput');inp.focus();
 const check=()=>{const ok=norm(inp.value)===norm(item.es),f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');if(ok){f.innerHTML=`<strong>✓ Doğru!</strong>${esc(item.es)} <button class="primary" id="nextTranslate" style="float:right;padding:7px 10px">Sonraki →</button>`;record(true,15);document.getElementById('nextTranslate').onclick=()=>{qIndex=(qIndex+1)%l.sentences.length;renderTranslate()}}else{f.innerHTML=`<strong>✕ Henüz değil.</strong>Doğru cevap: <b>${esc(item.es)}</b>`;record(false,0)}};

function vocab(){
 if(!vocabLesson){view.innerHTML=`<div class="page-head"><div><div class="eyebrow">Ders kelimeleri</div><h1>Kelime Çalışması</h1><p class="lead">Her dersin kelimeleri ayrı. PDF'deki temel kelime grupları ilgili derslere dağıtıldı; öğrenci dersten sonra yalnızca o kelimeleri çalışabilir.</p></div><span class="pill">🔊 İspanyolca ses</span></div>${lessonCards('vocab')}`;view.querySelectorAll('[data-vocab]').forEach(b=>b.onclick=()=>{vocabLesson=lessonById(b.dataset.vocab);vocabIndex=0;vocabMode='cards';vocabQuiz=null;vocab();window.scrollTo(0,0)});return}

 <div class="toolbar"><div class="seg"><button data-vmode="cards" class="${vocabMode==='cards'?'active':''}">Ezber Kartları</button><button data-vmode="test" class="${vocabMode==='test'?'active':''}">Kelime Testi</button></div></div><div id="vocabBody"></div>`;
 document.getElementById('backVocab').onclick=()=>{vocabLesson=null;vocabQuiz=null;vocab()};view.querySelectorAll('[data-vmode]').forEach(b=>b.onclick=()=>{vocabMode=b.dataset.vmode;vocabQuiz=null;renderVocabBody()});renderVocabBody()
