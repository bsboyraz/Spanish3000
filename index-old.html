<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ff" />
  <meta name="description" content="Spanish 3000 — Türkçe arayüzlü İspanyolca kelime, gramer ve cümle çalışma uygulaması." />
  <title>Spanish 3000</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="brand" data-nav="home" role="button" tabindex="0">
        <div class="brand-mark">S</div>
        <div><strong>Spanish 3000</strong><span>İspanyolca çalışma alanın</span></div>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" data-nav="home"><span>⌂</span><b>Ana Sayfa</b></button>
        <button class="nav-item" data-nav="vocabulary"><span>◫</span><b>Kelime Öğren</b></button>
        <button class="nav-item" data-nav="grammar"><span>✦</span><b>Gramer</b></button>
        <button class="nav-item" data-nav="sentence"><span>✎</span><b>Cümle Kur</b></button>
        <button class="nav-item" data-nav="leaderboard"><span>♕</span><b>Liderlik</b></button>
      </nav>

      <div class="sidebar-progress">
        <div class="progress-caption"><span>Genel ilerleme</span><strong id="sideProgressText">0 / 3000</strong></div>
        <div class="progress-track"><div id="sideProgressBar" class="progress-fill"></div></div>
        <small>Öğrendiğin kelimeler cihazında saklanır.</small>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-brand" data-nav="home"><span class="brand-mark small">S</span><b>Spanish 3000</b></button>
        <div class="top-actions">
          <button id="streakChip" class="stat-chip" title="Günlük seri">🔥 <b>0</b></button>
          <button id="xpChip" class="stat-chip" title="Toplam XP">⚡ <b>0 XP</b></button>
          <button id="profileBtn" class="avatar-btn" title="Profil adını değiştir"><span id="avatarLetter">S</span></button>
        </div>
      </header>

      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobil menü">
    <button class="mobile-nav-item active" data-nav="home"><span>⌂</span><small>Ana</small></button>
    <button class="mobile-nav-item" data-nav="vocabulary"><span>◫</span><small>Kelime</small></button>
    <button class="mobile-nav-item" data-nav="grammar"><span>✦</span><small>Gramer</small></button>
    <button class="mobile-nav-item" data-nav="sentence"><span>✎</span><small>Cümle</small></button>
    <button class="mobile-nav-item" data-nav="leaderboard"><span>♕</span><small>Liderlik</small></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <dialog id="profileDialog" class="profile-dialog">
    <form method="dialog" id="profileForm">
      <button class="dialog-close" value="cancel" aria-label="Kapat">×</button>
      <div class="dialog-icon">👋</div>
      <h2>Profilin</h2>
      <p>Liderlik tablosunda ve ilerleme alanında görünecek adını yaz.</p>
      <label for="playerName">Ad</label>
      <input id="playerName" maxlength="24" autocomplete="nickname" placeholder="Sare" />
      <button id="saveProfile" class="primary-btn full" value="default">Kaydet</button>
    </form>
  </dialog>

  <script src="spanish3000.js"></script>
  <script src="grammar.js"></script>
  <script src="app.js"></script>
</body>
</html>
